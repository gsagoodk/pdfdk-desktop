name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # The draft release is made once, before the builds: when both builds made it themselves, they
  # could do so at the same moment and leave two drafts (one per platform), as with v0.5.0.
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.make.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          gh release view "v$version" >/dev/null 2>&1 || gh release create "v$version" --draft --title "PDF.dk Flow v$version" --notes "See the assets below to download and install this version." --verify-tag
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name == \"v$version\")][0].id")" >> "$GITHUB_OUTPUT"

  release:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # one Mac build that runs natively on Apple Silicon and Intel
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      # Mac signing and notarisation run once the Apple secrets are set on this repository.
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install

      # Signed for real on the Mac (Developer ID + notarisation) instead of the ad-hoc "-" of local
      # builds – once the Apple secrets are set on this repository.
      - name: Developer ID signing
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE == 'true'
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            delete c.bundle.macOS.signingIdentity;
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          '

      # Windows code signing (SSL.com eSigner, a cloud certificate): CodeSignTool, pinned by SHA-256,
      # signs every .exe/.msi the build makes (Tauri calls it through bundle.windows.signCommand,
      # before the updater signatures are made). The credential is looked up from the login unless
      # ES_CREDENTIAL_ID is set. Without the secrets, Windows is built unsigned (as before).
      - name: Windows code signing
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
        run: |
          if (-not $env:ES_USERNAME) { Write-Host "::warning::No eSigner secrets – Windows is built unsigned"; exit 0 }
          $dir = "$env:RUNNER_TEMP\codesigntool"
          $zip = "$env:RUNNER_TEMP\codesigntool.zip"
          Invoke-WebRequest "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "F14B1E1EF14BFA1FD00279C363AAB0DEBBF5DCFBA0E4BCDCE5D22BB771DE0E3A") { throw "CodeSignTool: wrong checksum" }
          Expand-Archive $zip $dir
          $java = "$env:JAVA_HOME_17_X64\bin\java.exe"
          $jar = "$dir\jar\code_sign_tool-1.3.2.jar"
          $cred = $env:ES_CREDENTIAL_ID
          if (-not $cred) {
            Push-Location $dir
            $out = & $java -jar $jar get_credential_ids "-username=$env:ES_USERNAME" "-password=$env:ES_PASSWORD" | Out-String
            Pop-Location
            $cred = ([regex]"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}").Match($out).Value
            if (-not $cred) { throw "No eSigner credential found for the login: $out" }
          }
          Write-Host "::add-mask::$cred"
          "ES_CREDENTIAL_ID=$cred" >> $env:GITHUB_ENV
          # The command Tauri runs for each file. CodeSignTool can print an error and still exit 0,
          # so the file's signature is checked; a refused one-time code is tried again after 31 s.
          $sign = "$env:RUNNER_TEMP\sign.ps1"
          @"
          param([string]`$file)
          Set-Location "$dir"
          for (`$try = 1; `$try -le 3; `$try++) {
            & "$java" -jar "$jar" sign "-username=`$env:ES_USERNAME" "-password=`$env:ES_PASSWORD" "-credential_id=`$env:ES_CREDENTIAL_ID" "-totp_secret=`$env:ES_TOTP_SECRET" "-input_file_path=`$file" -override=true
            if ((Get-AuthenticodeSignature `$file).Status -eq 'Valid') { exit 0 }
            Start-Sleep -Seconds 31
          }
          throw "Not signed: `$file"
          "@ | Set-Content $sign
          # (From a file: quotes in a command-line script don't survive PowerShell → node.)
          @'
          const fs = require("fs"), f = "src-tauri/tauri.conf.json";
          const c = JSON.parse(fs.readFileSync(f, "utf8"));
          c.bundle.windows = { ...c.bundle.windows, signCommand: { cmd: "powershell", args: ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", process.argv[2], "%1"] } };
          fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          '@ | Set-Content "$env:RUNNER_TEMP\signconf.js"
          node "$env:RUNNER_TEMP\signconf.js" $sign

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Mac code signing + notarisation (same Developer ID as PDF.dk Client).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows (SSL.com eSigner) – used by the sign command set up above.
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          includeUpdaterJson: true   # latest.json for the in-app updater (endpoint in tauri.conf.json)
          prerelease: false
          args: ${{ matrix.args }}

      # The app inside is notarised by the build; the .dmg around it is notarised and stapled here
      # too, so a downloaded .dmg opens without Gatekeeper's warning (then replaces the release's copy).
      - name: Notarise the .dmg
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          spctl -a -vvv -t install "$dmg"
          name=$(basename "$dmg" | tr ' ' '.')
          cp "$dmg" "$RUNNER_TEMP/$name"
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          gh release upload "v$version" "$RUNNER_TEMP/$name" --clobber
